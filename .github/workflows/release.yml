name: Release

# Creates the GitHub release for a version tag. Only the upstream repository makes
# releases. In a copy made with the Deploy button, this workflow does nothing.
#
# To release: bump "version" in package.json, move the Unreleased notes in CHANGELOG.md
# to a section for the version, commit, then push the tag `vX.Y.Z`.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    if: github.repository == 'me-shaon/envelopen'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Check that the tag matches package.json
        run: |
          version="$(node scripts/update/version.mjs current)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match the version $version in package.json."
            exit 1
          fi

      - name: Get the release notes from CHANGELOG.md
        run: node scripts/update/version.mjs notes "$TAG" > "$RUNNER_TEMP/notes.md"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check the shipped migrations against the previous release
        run: |
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)"
          if [ -z "$previous" ]; then
            echo "::notice::No earlier release. Skipped the migration check."
          else
            node scripts/check-migrations.mjs --ref "$previous" --github
          fi
      - run: pnpm build

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Envelopen $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
