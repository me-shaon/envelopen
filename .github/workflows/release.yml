name: Release

# Creates the GitHub release for a version tag. Only the upstream repository makes
# releases. In a copy made with the Deploy button, this workflow does nothing.
#
# To release: bump ENVELOPEN_VERSION in apps/worker/src/version.ts (keep "version" in
# package.json at 0.0.0), move the Unreleased notes in CHANGELOG.md
# to a section for the version, commit, then push the tag `vX.Y.Z`.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    if: github.repository == 'me-shaon/envelopen'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Check that the tag matches apps/worker/src/version.ts
        run: |
          version="$(node scripts/update/version.mjs current)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match the version $version in apps/worker/src/version.ts."
            exit 1
          fi

      - name: Get the release notes from CHANGELOG.md
        run: node scripts/update/version.mjs notes "$TAG" > "$RUNNER_TEMP/notes.md"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check the shipped migrations against the previous release
        run: |
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)"
          if [ -z "$previous" ]; then
            echo "::notice::No earlier release. Skipped the migration check."
          else
            node scripts/check-migrations.mjs --ref "$previous" --github
          fi
      - run: pnpm build

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Envelopen $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
